services:
  admin:
    build: ./admin
    container_name: backend
    restart: always
    env_file:
      - .env
    ports:
      - "8081:80"
    depends_on:
      - api
      - mysql

  api:
    build: ./api
    container_name: api
    restart: always
    env_file:
      - .env
    ports:
      - "8083:80"
    depends_on:
      - mysql

  mysql:
    image: mysql:8.0
    container_name: mysql
    restart: always
    env_file:
      - .env
    volumes:
      - mysql_data:/var/lib/mysql
    expose:
      - "3306"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    restart: always
    env_file:
      - .env
    ports:
      - "8082:80"
    depends_on:
      - mysql

volumes:
  mysql_data:
